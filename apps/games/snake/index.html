<!DOCTYPE html>
<html lang="uz">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>AR Snake</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; }
  body {
    background: radial-gradient(circle at 50% 25%, #102a20 0%, #07120e 100%);
    color: #fff;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    height: 100vh;
    overflow: hidden;
  }
  .glass-card {
    background: rgba(255, 255, 255, 0.08);
    backdrop-filter: blur(24px);
    -webkit-backdrop-filter: blur(24px);
    border: 1px solid rgba(255, 255, 255, 0.15);
    border-radius: 20px;
    box-shadow: 0 16px 32px rgba(0,0,0,0.4), inset 0 1px 0 rgba(255,255,255,0.2);
  }
  header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    width: 92%;
    max-width: 420px;
    margin-bottom: 8px;
    padding: 8px 16px;
  }
  .title { font-size: 18px; font-weight: 700; color: #30d158; text-shadow: 0 0 12px rgba(48,209,88,0.4); }
  .best { font-size: 13px; color: #ffd60a; font-weight: 700; }
  .mode-bar {
    display: flex;
    gap: 8px;
    width: 92%;
    max-width: 420px;
    margin-bottom: 8px;
  }
  .pill {
    flex: 1;
    padding: 6px 10px;
    font-size: 12px;
    font-weight: 700;
    text-align: center;
    cursor: pointer;
    border-radius: 12px;
    background: rgba(255, 255, 255, 0.06);
    border: 1px solid rgba(255, 255, 255, 0.12);
  }
  .pill.active {
    background: #30d158;
    color: #000;
    border-color: #30d158;
  }
  .game-wrapper {
    position: relative;
    width: 92%;
    max-width: 420px;
  }
  canvas#canvas {
    width: 100%;
    height: auto;
    background: rgba(5, 20, 14, 0.85);
    border: 1.5px solid rgba(48, 209, 88, 0.3);
    border-radius: 16px;
    box-shadow: 0 12px 28px rgba(0,0,0,0.6);
    display: block;
  }
  .dpad {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    grid-template-rows: repeat(2, 48px);
    gap: 8px;
    margin-top: 10px;
    width: 92%;
    max-width: 420px;
  }
  .dbtn {
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 18px;
    font-weight: 800;
    color: #fff;
    border-radius: 14px;
    cursor: pointer;
    background: rgba(255, 255, 255, 0.08);
    border: 1px solid rgba(255, 255, 255, 0.15);
  }
  .dbtn:active {
    background: rgba(48, 209, 88, 0.4);
    transform: scale(0.94);
  }
  .overlay {
    position: absolute;
    inset: 0;
    background: rgba(0,0,0,0.8);
    backdrop-filter: blur(14px);
    display: none;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    border-radius: 16px;
    z-index: 10;
  }
  .overlay.active { display: flex; }
  .modal-title { font-size: 28px; font-weight: 800; color: #ff453a; margin-bottom: 6px; }
  .modal-btn {
    margin-top: 14px;
    padding: 12px 32px;
    font-size: 16px;
    background: #30d158;
    border-radius: 24px;
    color: #000;
    font-weight: 800;
    cursor: pointer;
  }
</style>
</head>
<body>

<header class="glass-card">
  <div class="title">🐍 AR Iloncha</div>
  <div style="font-size: 14px; font-weight: 800;">BALL: <span id="scoreVal" style="color: #30d158;">0</span></div>
  <div class="best">REKORD: <span id="bestVal">0</span></div>
</header>

<div class="mode-bar">
  <div class="pill active" id="btnWall">🧱 Devorli</div>
  <div class="pill" id="btnWrap">🌀 Devorsiz</div>
  <div class="pill" id="btnSpeed">⚡ Tezlik: O'rta</div>
</div>

<div class="game-wrapper">
  <canvas id="canvas" width="400" height="400"></canvas>
  <div class="overlay" id="overlay">
    <div class="modal-title" id="modalTitle">HALOKAT!</div>
    <div style="font-size: 18px; color: #ffd60a; margin-top: 6px;" id="modalScore">Jami Ball: 0</div>
    <div class="modal-btn" id="modalBtn">Qayta boshlash</div>
  </div>
</div>

<div class="dpad">
  <div></div>
  <div class="dbtn" id="btnUp">▲</div>
  <div class="dbtn" id="btnPause">⏸</div>
  <div class="dbtn" id="btnLeft">◀</div>
  <div class="dbtn" id="btnDown">▼</div>
  <div class="dbtn" id="btnRight">▶</div>
</div>

<script>
const canvas = document.getElementById('canvas');
const ctx = canvas.getContext('2d');
const GRID = 20;
const TILE = canvas.width / GRID;

let snake = [{x: 10, y: 10}, {x: 9, y: 10}, {x: 8, y: 10}];
let dir = {x: 1, y: 0};
let nextDir = {x: 1, y: 0};
let food = {x: 15, y: 10};
let star = null;
let starTimer = 0;
let score = 0;
let isWallMode = true;
let speedDelay = 110;
let isGameOver = false, isPaused = false;
let gameLoopTimer = null;

const bestScore = parseInt(localStorage.getItem('ar_port_snake_best') || '0');
document.getElementById('bestVal').innerText = bestScore;

// Audio Synth
const AudioContext = window.AudioContext || window.webkitAudioContext;
let audioCtx = null;
function playSound(freq, duration = 0.08, type = 'sine') {
  try {
    if (!audioCtx) audioCtx = new AudioContext();
    if (audioCtx.state === 'suspended') audioCtx.resume();
    const osc = audioCtx.createOscillator();
    const gain = audioCtx.createGain();
    osc.type = type;
    osc.frequency.setValueAtTime(freq, audioCtx.currentTime);
    gain.gain.setValueAtTime(0.15, audioCtx.currentTime);
    gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + duration);
    osc.connect(gain);
    gain.connect(audioCtx.destination);
    osc.start();
    osc.stop(audioCtx.currentTime + duration);
  } catch(e){}
}

function spawnFood() {
  while (true) {
    const fx = Math.floor(Math.random() * GRID);
    const fy = Math.floor(Math.random() * GRID);
    if (!snake.some(s => s.x === fx && s.y === fy)) {
      food = {x: fx, y: fy};
      break;
    }
  }
}

function spawnStar() {
  while (true) {
    const fx = Math.floor(Math.random() * GRID);
    const fy = Math.floor(Math.random() * GRID);
    if (!snake.some(s => s.x === fx && s.y === fy) && !(food.x === fx && food.y === fy)) {
      star = {x: fx, y: fy};
      starTimer = 60; // 60 ticks
      break;
    }
  }
}

function setDirection(dx, dy) {
  // Prevent 180 reverse
  if (dir.x + dx === 0 && dir.y + dy === 0) return;
  nextDir = {x: dx, y: dy};
}

function tick() {
  if (isPaused || isGameOver) return;

  dir = nextDir;
  let head = {x: snake[0].x + dir.x, y: snake[0].y + dir.y};

  // Wall or Wrap
  if (isWallMode) {
    if (head.x < 0 || head.x >= GRID || head.y < 0 || head.y >= GRID) {
      gameOver();
      return;
    }
  } else {
    head.x = (head.x + GRID) % GRID;
    head.y = (head.y + GRID) % GRID;
  }

  // Self bite
  if (snake.some(s => s.x === head.x && s.y === head.y)) {
    gameOver();
    return;
  }

  snake.unshift(head);

  // Check food
  if (head.x === food.x && head.y === food.y) {
    score += 10;
    document.getElementById('scoreVal').innerText = score;
    playSound(620, 0.08, 'triangle');
    spawnFood();
    if (Math.random() < 0.25 && !star) {
      spawnStar();
    }
  } else if (star && head.x === star.x && head.y === star.y) {
    score += 50;
    document.getElementById('scoreVal').innerText = score;
    playSound(920, 0.15, 'square');
    star = null;
  } else {
    snake.pop();
  }

  if (star) {
    starTimer--;
    if (starTimer <= 0) star = null;
  }

  draw();
}

function draw() {
  ctx.clearRect(0, 0, canvas.width, canvas.height);

  // Grid
  ctx.strokeStyle = 'rgba(48, 209, 88, 0.05)';
  for (let i = 0; i < GRID; i++) {
    ctx.beginPath(); ctx.moveTo(i * TILE, 0); ctx.lineTo(i * TILE, canvas.height); ctx.stroke();
    ctx.beginPath(); ctx.moveTo(0, i * TILE); ctx.lineTo(canvas.width, i * TILE); ctx.stroke();
  }

  // Draw Food (Apple)
  ctx.fillStyle = '#ff3b30';
  ctx.beginPath();
  ctx.arc(food.x * TILE + TILE / 2, food.y * TILE + TILE / 2, TILE * 0.42, 0, Math.PI * 2);
  ctx.fill();
  // Leaf
  ctx.fillStyle = '#30d158';
  ctx.fillRect(food.x * TILE + TILE / 2 - 1, food.y * TILE + 2, 4, 4);

  // Draw Golden Star
  if (star) {
    ctx.fillStyle = '#ffd60a';
    ctx.beginPath();
    ctx.arc(star.x * TILE + TILE / 2, star.y * TILE + TILE / 2, TILE * 0.45, 0, Math.PI * 2);
    ctx.fill();
  }

  // Draw Snake
  snake.forEach((s, idx) => {
    if (idx === 0) {
      // Head
      ctx.fillStyle = '#30d158';
      ctx.beginPath();
      ctx.roundRect(s.x * TILE + 1, s.y * TILE + 1, TILE - 2, TILE - 2, 8);
      ctx.fill();
      // Eyes
      ctx.fillStyle = '#000';
      const eyeOffX = dir.x === 0 ? 4 : (dir.x > 0 ? 12 : 2);
      const eyeOffY = dir.y === 0 ? 4 : (dir.y > 0 ? 12 : 2);
      ctx.fillRect(s.x * TILE + eyeOffX, s.y * TILE + eyeOffY, 3, 3);
    } else {
      // Body
      const alpha = Math.max(0.4, 1 - idx / snake.length * 0.5);
      ctx.fillStyle = `rgba(48, 209, 88, ${alpha})`;
      ctx.beginPath();
      ctx.roundRect(s.x * TILE + 2, s.y * TILE + 2, TILE - 4, TILE - 4, 4);
      ctx.fill();
    }
  });
}

function gameOver() {
  isGameOver = true;
  playSound(150, 0.4, 'sawtooth');
  document.getElementById('modalTitle').innerText = "HALOKAT!";
  document.getElementById('modalScore').innerText = "Jami Ball: " + score;
  document.getElementById('overlay').classList.add('active');

  const curBest = parseInt(localStorage.getItem('ar_port_snake_best') || '0');
  if (score > curBest) {
    localStorage.setItem('ar_port_snake_best', score);
    document.getElementById('bestVal').innerText = score;
  }
}

function restartGame() {
  snake = [{x: 10, y: 10}, {x: 9, y: 10}, {x: 8, y: 10}];
  dir = {x: 1, y: 0};
  nextDir = {x: 1, y: 0};
  score = 0;
  star = null;
  isGameOver = false;
  isPaused = false;
  document.getElementById('scoreVal').innerText = '0';
  document.getElementById('overlay').classList.remove('active');
  spawnFood();
  draw();
}

// Mode switches
const btnWall = document.getElementById('btnWall');
const btnWrap = document.getElementById('btnWrap');
const btnSpeed = document.getElementById('btnSpeed');

btnWall.addEventListener('click', () => {
  isWallMode = true;
  btnWall.classList.add('active');
  btnWrap.classList.remove('active');
  canvas.style.borderColor = 'rgba(48, 209, 88, 0.4)';
});

btnWrap.addEventListener('click', () => {
  isWallMode = false;
  btnWrap.classList.add('active');
  btnWall.classList.remove('active');
  canvas.style.borderColor = 'rgba(100, 210, 255, 0.4)';
});

let speedIdx = 1;
const speeds = [
  { name: "Oson", ms: 140 },
  { name: "O'rta", ms: 100 },
  { name: "Tez", ms: 65 }
];
btnSpeed.addEventListener('click', () => {
  speedIdx = (speedIdx + 1) % speeds.length;
  btnSpeed.innerText = '⚡ Tezlik: ' + speeds[speedIdx].name;
  speedDelay = speeds[speedIdx].ms;
  clearInterval(gameLoopTimer);
  gameLoopTimer = setInterval(tick, speedDelay);
});

// Controls
document.getElementById('btnUp').addEventListener('click', () => setDirection(0, -1));
document.getElementById('btnDown').addEventListener('click', () => setDirection(0, 1));
document.getElementById('btnLeft').addEventListener('click', () => setDirection(-1, 0));
document.getElementById('btnRight').addEventListener('click', () => setDirection(1, 0));
document.getElementById('modalBtn').addEventListener('click', restartGame);

const btnPause = document.getElementById('btnPause');
btnPause.addEventListener('click', () => {
  if (isGameOver) return;
  isPaused = !isPaused;
  btnPause.innerText = isPaused ? '▶' : '⏸';
  if (isPaused) {
    document.getElementById('modalTitle').innerText = "PAUZA";
    document.getElementById('modalScore').innerText = "Davom etish uchun bosing";
    document.getElementById('overlay').classList.add('active');
  } else {
    document.getElementById('overlay').classList.remove('active');
  }
});

// Spatial Gestures
window.onArGesture = function(gesture) {
  if (isGameOver) {
    if (gesture === 'TAP' || gesture === 'PINCH') restartGame();
    return;
  }
  switch(gesture) {
    case 'SWIPE_UP': setDirection(0, -1); break;
    case 'SWIPE_DOWN': setDirection(0, 1); break;
    case 'SWIPE_LEFT': setDirection(-1, 0); break;
    case 'SWIPE_RIGHT': setDirection(1, 0); break;
  }
};

// Keyboard
window.addEventListener('keydown', (e) => {
  if (e.key === 'ArrowUp') setDirection(0, -1);
  if (e.key === 'ArrowDown') setDirection(0, 1);
  if (e.key === 'ArrowLeft') setDirection(-1, 0);
  if (e.key === 'ArrowRight') setDirection(1, 0);
});

// Canvas Swipe
let touchStartX = 0, touchStartY = 0;
canvas.addEventListener('touchstart', (e) => {
  touchStartX = e.touches[0].clientX;
  touchStartY = e.touches[0].clientY;
}, { passive: true });

canvas.addEventListener('touchend', (e) => {
  const dx = e.changedTouches[0].clientX - touchStartX;
  const dy = e.changedTouches[0].clientY - touchStartY;
  if (Math.abs(dx) > Math.abs(dy) && Math.abs(dx) > 25) {
    setDirection(dx > 0 ? 1 : -1, 0);
  } else if (Math.abs(dy) > Math.abs(dx) && Math.abs(dy) > 25) {
    setDirection(0, dy > 0 ? 1 : -1);
  }
}, { passive: true });

// Start
spawnFood();
draw();
gameLoopTimer = setInterval(tick, speedDelay);
</script>
</body>
</html>
