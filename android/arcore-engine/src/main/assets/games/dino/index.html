<!DOCTYPE html>
<html lang="uz">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>AR Dino Runner</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; }
  body {
    background: #0d1117;
    color: #fff;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    height: 100vh;
    overflow: hidden;
  }
  .glass-card {
    background: rgba(255, 255, 255, 0.08);
    backdrop-filter: blur(24px);
    -webkit-backdrop-filter: blur(24px);
    border: 1px solid rgba(255, 255, 255, 0.15);
    border-radius: 20px;
    box-shadow: 0 16px 32px rgba(0,0,0,0.4), inset 0 1px 0 rgba(255,255,255,0.2);
  }
  header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    width: 95%;
    max-width: 900px;
    margin-bottom: 12px;
    padding: 10px 20px;
  }
  .title { font-size: 20px; font-weight: 700; color: #30d158; text-shadow: 0 0 12px rgba(48,209,88,0.4); }
  .stats { display: flex; gap: 20px; font-size: 14px; font-weight: 700; }
  .best { color: #ffd60a; }
  .score { color: #fff; }
  .game-wrapper {
    position: relative;
    width: 95%;
    max-width: 900px;
  }
  canvas#gameCanvas {
    width: 100%;
    height: auto;
    background: #161b22;
    border: 1.5px solid rgba(255, 255, 255, 0.15);
    border-radius: 16px;
    box-shadow: 0 12px 28px rgba(0,0,0,0.5);
    display: block;
  }
  .controls {
    display: flex;
    gap: 12px;
    margin-top: 12px;
    width: 95%;
    max-width: 900px;
  }
  .btn {
    flex: 1;
    padding: 14px;
    font-size: 16px;
    font-weight: 700;
    color: #fff;
    cursor: pointer;
    text-align: center;
    border-radius: 16px;
    transition: all 0.15s ease;
  }
  .btn:active {
    transform: scale(0.96);
    background: rgba(255, 255, 255, 0.22);
  }
  .overlay {
    position: absolute;
    inset: 0;
    background: rgba(0,0,0,0.7);
    backdrop-filter: blur(12px);
    display: none;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    border-radius: 16px;
    z-index: 10;
  }
  .overlay.active { display: flex; }
  .modal-title { font-size: 32px; font-weight: 800; color: #ff453a; margin-bottom: 8px; }
  .modal-btn {
    margin-top: 16px;
    padding: 12px 32px;
    font-size: 16px;
    background: #30d158;
    border-radius: 24px;
    color: #000;
    font-weight: 800;
    cursor: pointer;
  }
</style>
</head>
<body>

<header class="glass-card">
  <div class="title">🦖 AR Dino Yugurish</div>
  <div class="stats">
    <div class="best">HI: <span id="bestVal">0</span></div>
    <div class="score">MASOFA: <span id="scoreVal">0</span> m</div>
  </div>
</header>

<div class="game-wrapper">
  <canvas id="gameCanvas" width="900" height="360"></canvas>
  <div class="overlay" id="overlay">
    <div class="modal-title" id="modalTitle">HALOKAT!</div>
    <div style="font-size: 20px; color: #ffd60a;" id="modalScore">Masofa: 0 m</div>
    <div class="modal-btn" id="modalBtn">Qayta yugurish</div>
  </div>
</div>

<div class="controls">
  <div class="btn glass-card" id="btnJump">⬆ SAKRASH (TAP / SWIPE UP)</div>
  <div class="btn glass-card" id="btnDuck">⬇ EGILISH (SWIPE DOWN)</div>
  <div class="btn glass-card" id="btnPause" style="flex: 0.4;">⏸</div>
</div>

<script>
const canvas = document.getElementById('gameCanvas');
const ctx = canvas.getContext('2d');

let isGameOver = false, isPaused = false;
let score = 0, distanceCounter = 0;
let speed = 7.5;
let dayTime = 0; // 0 = day, 1000 = night cycle

const bestScore = parseInt(localStorage.getItem('ar_port_dino_best') || '0');
document.getElementById('bestVal').innerText = bestScore;

// Audio Synth
const AudioContext = window.AudioContext || window.webkitAudioContext;
let audioCtx = null;
function playSound(freq, duration = 0.08, type = 'sine') {
  try {
    if (!audioCtx) audioCtx = new AudioContext();
    if (audioCtx.state === 'suspended') audioCtx.resume();
    const osc = audioCtx.createOscillator();
    const gain = audioCtx.createGain();
    osc.type = type;
    osc.frequency.setValueAtTime(freq, audioCtx.currentTime);
    gain.gain.setValueAtTime(0.15, audioCtx.currentTime);
    gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + duration);
    osc.connect(gain);
    gain.connect(audioCtx.destination);
    osc.start();
    osc.stop(audioCtx.currentTime + duration);
  } catch(e){}
}

const GROUND_Y = 300;

const dino = {
  x: 80,
  y: GROUND_Y - 58,
  w: 44,
  h: 58,
  vy: 0,
  gravity: 0.72,
  isJumping: false,
  isDucking: false,
  legAnim: 0,
  jump() {
    if (!this.isJumping) {
      this.vy = -14.5;
      this.isJumping = true;
      playSound(600, 0.06, 'triangle');
    }
  },
  duck(state) {
    if (this.isJumping) return;
    this.isDucking = state;
    if (state) {
      this.h = 32;
      this.w = 58;
      this.y = GROUND_Y - 32;
    } else {
      this.h = 58;
      this.w = 44;
      this.y = GROUND_Y - 58;
    }
  },
  update() {
    if (this.isJumping) {
      this.vy += this.gravity;
      this.y += this.vy;
      if (this.y >= GROUND_Y - this.h) {
        this.y = GROUND_Y - this.h;
        this.vy = 0;
        this.isJumping = false;
      }
    }
    this.legAnim += 0.25;
  },
  draw() {
    ctx.save();
    ctx.translate(this.x, this.y);
    const bodyColor = '#30d158';
    ctx.fillStyle = bodyColor;

    if (this.isDucking) {
      // Ducking dino
      ctx.fillRect(0, 8, 48, 20); // body
      ctx.fillRect(40, 0, 18, 16); // head
      ctx.fillStyle = '#000';
      ctx.fillRect(50, 4, 3, 3); // eye
      ctx.fillStyle = bodyColor;
      // legs
      const legOffset = Math.sin(this.legAnim) > 0 ? 4 : 0;
      ctx.fillRect(14, 28, 6, 4 - legOffset);
      ctx.fillRect(32, 28, 6, legOffset);
    } else {
      // Normal standing/jumping dino
      ctx.fillRect(10, 14, 26, 32); // body
      ctx.fillRect(20, 0, 24, 20);  // head
      ctx.fillRect(0, 18, 10, 14);  // tail
      ctx.fillStyle = '#000';
      ctx.fillRect(36, 4, 4, 4);    // eye
      ctx.fillStyle = bodyColor;
      ctx.fillRect(38, 24, 8, 4);   // arms
      // legs
      if (this.isJumping) {
        ctx.fillRect(14, 46, 6, 12);
        ctx.fillRect(26, 46, 6, 10);
      } else {
        const legStep = Math.sin(this.legAnim) > 0;
        ctx.fillRect(14, 46, 6, legStep ? 12 : 6);
        ctx.fillRect(26, 46, 6, legStep ? 6 : 12);
      }
    }
    ctx.restore();
  }
};

let obstacles = [];
let nextObstacleCounter = 80;

function spawnObstacle() {
  const isBird = score > 150 && Math.random() < 0.35;
  if (isBird) {
    const altitudes = [GROUND_Y - 40, GROUND_Y - 70, GROUND_Y - 100];
    const y = altitudes[Math.floor(Math.random() * altitudes.length)];
    obstacles.push({
      type: 'bird',
      x: canvas.width + 20,
      y: y,
      w: 42,
      h: 28,
      wingAnim: 0
    });
  } else {
    // Cactus
    const count = Math.floor(Math.random() * 3) + 1;
    const w = count === 1 ? 22 : (count === 2 ? 40 : 58);
    const h = 48 + Math.floor(Math.random() * 16);
    obstacles.push({
      type: 'cactus',
      x: canvas.width + 20,
      y: GROUND_Y - h,
      w: w,
      h: h,
      count: count
    });
  }
}

// Ground particles
let groundParticles = [];
for (let i = 0; i < 40; i++) {
  groundParticles.push({
    x: Math.random() * canvas.width,
    y: GROUND_Y + Math.random() * 50 + 4,
    size: Math.random() * 3 + 1
  });
}

function checkCollision(r1, r2) {
  const pad = 6;
  return (
    r1.x + pad < r2.x + r2.w &&
    r1.x + r1.w - pad > r2.x &&
    r1.y + pad < r2.y + r2.h &&
    r1.y + r1.h - pad > r2.y
  );
}

function update() {
  if (isGameOver || isPaused) {
    requestAnimationFrame(update);
    return;
  }

  dayTime = (dayTime + 0.3) % 1800;
  const isNight = dayTime > 900;
  canvas.style.backgroundColor = isNight ? '#0b0e14' : '#161b22';

  // Distance score
  distanceCounter += 1;
  if (distanceCounter % 4 === 0) {
    score += 1;
    document.getElementById('scoreVal').innerText = score;
    if (score % 100 === 0) {
      playSound(900, 0.12, 'square');
      speed = Math.min(16, speed + 0.4);
    }
  }

  dino.update();

  // Ground scrolling
  groundParticles.forEach(p => {
    p.x -= speed;
    if (p.x < 0) p.x = canvas.width + Math.random() * 40;
  });

  // Obstacles
  nextObstacleCounter -= speed * 0.12;
  if (nextObstacleCounter <= 0) {
    spawnObstacle();
    nextObstacleCounter = Math.random() * 60 + 50;
  }

  for (let i = obstacles.length - 1; i >= 0; i--) {
    const ob = obstacles[i];
    ob.x -= speed;

    if (ob.type === 'bird') {
      ob.wingAnim += 0.2;
    }

    if (checkCollision(dino, ob)) {
      gameOver();
      break;
    }

    if (ob.x + ob.w < -20) {
      obstacles.splice(i, 1);
    }
  }

  draw();
  requestAnimationFrame(update);
}

function draw() {
  ctx.clearRect(0, 0, canvas.width, canvas.height);

  // Ground line
  ctx.strokeStyle = 'rgba(255, 255, 255, 0.25)';
  ctx.lineWidth = 2;
  ctx.beginPath();
  ctx.moveTo(0, GROUND_Y);
  ctx.lineTo(canvas.width, GROUND_Y);
  ctx.stroke();

  // Ground pebbles
  ctx.fillStyle = 'rgba(255, 255, 255, 0.18)';
  groundParticles.forEach(p => {
    ctx.fillRect(p.x, p.y, p.size, p.size);
  });

  // Clouds/stars
  if (dayTime > 900) {
    ctx.fillStyle = 'rgba(255, 255, 255, 0.4)';
    ctx.fillRect(200, 50, 2, 2);
    ctx.fillRect(450, 80, 2, 2);
    ctx.fillRect(720, 40, 2, 2);
    // Moon
    ctx.fillStyle = '#ffd60a';
    ctx.beginPath();
    ctx.arc(820, 60, 16, 0, Math.PI * 2);
    ctx.fill();
  }

  // Draw obstacles
  obstacles.forEach(ob => {
    if (ob.type === 'cactus') {
      ctx.fillStyle = '#ff9f0a';
      // Main stem
      ctx.fillRect(ob.x + ob.w / 2 - 5, ob.y, 10, ob.h);
      // Arms
      ctx.fillRect(ob.x, ob.y + ob.h * 0.35, 8, 4);
      ctx.fillRect(ob.x, ob.y + ob.h * 0.2, 4, ob.h * 0.18);
      ctx.fillRect(ob.x + ob.w - 8, ob.y + ob.h * 0.45, 8, 4);
      ctx.fillRect(ob.x + ob.w - 4, ob.y + ob.h * 0.25, 4, ob.h * 0.22);
    } else {
      // Pterodactyl
      ctx.save();
      ctx.translate(ob.x, ob.y);
      ctx.fillStyle = '#64d2ff';
      ctx.fillRect(10, 10, 24, 10); // body
      ctx.fillRect(0, 6, 12, 8);   // beak
      const wingY = Math.sin(ob.wingAnim) > 0 ? -12 : 12;
      ctx.beginPath();
      ctx.moveTo(18, 10);
      ctx.lineTo(26, 10 + wingY);
      ctx.lineTo(34, 10);
      ctx.fill();
      ctx.restore();
    }
  });

  // Draw Dino
  dino.draw();
}

function gameOver() {
  isGameOver = true;
  playSound(160, 0.35, 'sawtooth');
  document.getElementById('modalTitle').innerText = "HALOKAT!";
  document.getElementById('modalScore').innerText = "Masofa: " + score + " metr";
  document.getElementById('overlay').classList.add('active');

  const curBest = parseInt(localStorage.getItem('ar_port_dino_best') || '0');
  if (score > curBest) {
    localStorage.setItem('ar_port_dino_best', score);
    document.getElementById('bestVal').innerText = score;
  }
}

function restartGame() {
  isGameOver = false;
  isPaused = false;
  score = 0;
  distanceCounter = 0;
  speed = 7.5;
  obstacles = [];
  nextObstacleCounter = 80;
  dino.y = GROUND_Y - 58;
  dino.vy = 0;
  dino.isJumping = false;
  dino.duck(false);
  document.getElementById('scoreVal').innerText = '0';
  document.getElementById('overlay').classList.remove('active');
}

// Controls
const btnJump = document.getElementById('btnJump');
const btnDuck = document.getElementById('btnDuck');
const btnPause = document.getElementById('btnPause');
const modalBtn = document.getElementById('modalBtn');

btnJump.addEventListener('click', () => dino.jump());
modalBtn.addEventListener('click', restartGame);

btnDuck.addEventListener('touchstart', (e) => { e.preventDefault(); dino.duck(true); });
btnDuck.addEventListener('touchend', (e) => { e.preventDefault(); dino.duck(false); });
btnDuck.addEventListener('mousedown', () => dino.duck(true));
btnDuck.addEventListener('mouseup', () => dino.duck(false));

btnPause.addEventListener('click', () => {
  isPaused = !isPaused;
  btnPause.innerText = isPaused ? '▶' : '⏸';
  if (isPaused) {
    document.getElementById('modalTitle').innerText = "PAUZA";
    document.getElementById('modalScore').innerText = "Davom etish uchun bosing";
    document.getElementById('overlay').classList.add('active');
  } else {
    document.getElementById('overlay').classList.remove('active');
  }
});

// Spatial Gestures
window.onArGesture = function(gesture) {
  if (isGameOver) {
    if (gesture === 'TAP' || gesture === 'PINCH') restartGame();
    return;
  }
  switch(gesture) {
    case 'TAP':
    case 'PINCH':
    case 'SWIPE_UP':
      dino.jump();
      break;
    case 'SWIPE_DOWN':
      dino.duck(true);
      setTimeout(() => dino.duck(false), 600);
      break;
  }
};

// Keyboard
window.addEventListener('keydown', (e) => {
  if (e.code === 'Space' || e.code === 'ArrowUp') dino.jump();
  if (e.code === 'ArrowDown') dino.duck(true);
});
window.addEventListener('keyup', (e) => {
  if (e.code === 'ArrowDown') dino.duck(false);
});

// Touch on canvas
let touchStartY = 0;
canvas.addEventListener('touchstart', (e) => {
  touchStartY = e.touches[0].clientY;
  dino.jump();
}, { passive: true });

canvas.addEventListener('touchmove', (e) => {
  const dy = e.touches[0].clientY - touchStartY;
  if (dy > 30) {
    dino.duck(true);
  }
}, { passive: true });

canvas.addEventListener('touchend', () => {
  dino.duck(false);
}, { passive: true });

// Start loop
update();
</script>
</body>
</html>
