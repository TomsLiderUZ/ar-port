<!DOCTYPE html>
<html lang="uz">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>AR Tetris</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; }
  body {
    background: radial-gradient(circle at 50% 20%, #1a1e29 0%, #0c0e14 100%);
    color: #fff;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    height: 100vh;
    overflow: hidden;
  }
  .glass-card {
    background: rgba(255, 255, 255, 0.08);
    backdrop-filter: blur(24px);
    -webkit-backdrop-filter: blur(24px);
    border: 1px solid rgba(255, 255, 255, 0.15);
    border-radius: 20px;
    box-shadow: 0 16px 32px rgba(0,0,0,0.4), inset 0 1px 0 rgba(255,255,255,0.2);
  }
  header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    width: 94%;
    max-width: 440px;
    margin-bottom: 12px;
    padding: 8px 16px;
  }
  .title { font-size: 20px; font-weight: 700; color: #64d2ff; text-shadow: 0 0 12px rgba(100,210,255,0.4); }
  .best { font-size: 13px; color: #ffd60a; font-weight: 600; }
  .game-container {
    display: flex;
    gap: 12px;
    width: 94%;
    max-width: 440px;
    justify-content: center;
    align-items: flex-start;
  }
  .side-panel {
    display: flex;
    flex-direction: column;
    gap: 10px;
    width: 84px;
  }
  .box {
    padding: 10px;
    display: flex;
    flex-direction: column;
    align-items: center;
    text-align: center;
  }
  .box-label { font-size: 11px; text-transform: uppercase; color: #8e8e93; font-weight: 700; margin-bottom: 4px; }
  .box-val { font-size: 16px; font-weight: 800; color: #fff; }
  canvas#board {
    background: rgba(10, 12, 18, 0.7);
    border: 1.5px solid rgba(255, 255, 255, 0.18);
    border-radius: 12px;
    box-shadow: inset 0 0 20px rgba(0,0,0,0.8);
    display: block;
  }
  .controls {
    display: flex;
    gap: 8px;
    margin-top: 14px;
    width: 94%;
    max-width: 440px;
    justify-content: center;
  }
  .btn {
    flex: 1;
    padding: 12px 6px;
    font-size: 14px;
    font-weight: 600;
    color: #fff;
    border: none;
    cursor: pointer;
    text-align: center;
    transition: all 0.15s ease;
  }
  .btn:active {
    transform: scale(0.94);
    background: rgba(255, 255, 255, 0.22);
  }
  .overlay {
    position: absolute;
    inset: 0;
    background: rgba(0,0,0,0.75);
    backdrop-filter: blur(12px);
    display: none;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    z-index: 10;
  }
  .overlay.active { display: flex; }
  .modal-title { font-size: 28px; font-weight: 800; margin-bottom: 8px; color: #ff453a; }
  .modal-btn {
    margin-top: 16px;
    padding: 12px 28px;
    font-size: 16px;
    background: #0a84ff;
    border-radius: 24px;
    color: #fff;
    font-weight: 700;
    cursor: pointer;
  }
</style>
</head>
<body>

<header class="glass-card">
  <div class="title">🕹️ AR Tetris</div>
  <div class="best">REKORD: <span id="bestVal">0</span></div>
</header>

<div class="game-container">
  <div class="side-panel">
    <div class="box glass-card">
      <div class="box-label">HOLD</div>
      <canvas id="holdCanvas" width="60" height="60"></canvas>
    </div>
    <div class="box glass-card">
      <div class="box-label">BALL</div>
      <div class="box-val" id="scoreVal">0</div>
    </div>
    <div class="box glass-card">
      <div class="box-label">LEVEL</div>
      <div class="box-val" id="levelVal">1</div>
    </div>
  </div>

  <canvas id="board" width="220" height="440"></canvas>

  <div class="side-panel">
    <div class="box glass-card">
      <div class="box-label">KEYINGI</div>
      <canvas id="nextCanvas" width="60" height="60"></canvas>
    </div>
    <div class="box glass-card">
      <div class="box-label">QATOR</div>
      <div class="box-val" id="linesVal">0</div>
    </div>
    <div class="box glass-card" id="btnPause" style="cursor: pointer;">
      <div class="box-label">PAUZA</div>
      <div class="box-val" id="pauseIcon">⏸</div>
    </div>
  </div>
</div>

<div class="controls">
  <div class="btn glass-card" id="btnHold">HOLD</div>
  <div class="btn glass-card" id="btnLeft">◀</div>
  <div class="btn glass-card" id="btnRotate">🔄</div>
  <div class="btn glass-card" id="btnRight">▶</div>
  <div class="btn glass-card" id="btnDrop">⬇ DROP</div>
</div>

<div class="overlay" id="overlay">
  <div class="modal-title" id="modalTitle">O'YIN TUGADI</div>
  <div style="color: #ffd60a; font-size: 18px;" id="modalScore">Ball: 0</div>
  <div class="modal-btn" id="modalBtn">Qayta boshlash</div>
</div>

<script>
const COLS = 10, ROWS = 20, BLOCK = 22;
const boardCanvas = document.getElementById('board');
const ctx = boardCanvas.getContext('2d');
const holdCtx = document.getElementById('holdCanvas').getContext('2d');
const nextCtx = document.getElementById('nextCanvas').getContext('2d');

const COLORS = [
  null,
  '#00f0ff', // I - cyan
  '#0033ff', // J - blue
  '#ff9900', // L - orange
  '#ffe600', // O - yellow
  '#00ff66', // S - green
  '#b300ff', // T - purple
  '#ff0033'  // Z - red
];

const SHAPES = [
  [],
  [[1,1,1,1]],
  [[2,0,0],[2,2,2]],
  [[0,0,3],[3,3,3]],
  [[4,4],[4,4]],
  [[0,5,5],[5,5,0]],
  [[0,6,0],[6,6,6]],
  [[7,7,0],[0,7,7]]
];

let board = Array.from({length: ROWS}, () => Array(COLS).fill(0));
let score = 0, lines = 0, level = 1;
let currentPiece = null, nextPiece = null, holdPiece = null, canHold = true;
let dropCounter = 0, dropInterval = 800, lastTime = 0;
let isPaused = false, isGameOver = false;

// Audio Synth
const AudioContext = window.AudioContext || window.webkitAudioContext;
let audioCtx = null;
function playSound(freq, duration = 0.08, type = 'sine') {
  try {
    if (!audioCtx) audioCtx = new AudioContext();
    if (audioCtx.state === 'suspended') audioCtx.resume();
    const osc = audioCtx.createOscillator();
    const gain = audioCtx.createGain();
    osc.type = type;
    osc.frequency.setValueAtTime(freq, audioCtx.currentTime);
    gain.gain.setValueAtTime(0.15, audioCtx.currentTime);
    gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + duration);
    osc.connect(gain);
    gain.connect(audioCtx.destination);
    osc.start();
    osc.stop(audioCtx.currentTime + duration);
  } catch(e){}
}

const bestVal = parseInt(localStorage.getItem('ar_port_tetris_best') || '0');
document.getElementById('bestVal').innerText = bestVal;

function randomPiece() {
  const typeId = Math.floor(Math.random() * 7) + 1;
  const shape = SHAPES[typeId];
  return {
    shape: shape,
    typeId: typeId,
    x: Math.floor(COLS / 2) - Math.ceil(shape[0].length / 2),
    y: 0
  };
}

function collide(b, piece) {
  const m = piece.shape;
  for (let y = 0; y < m.length; ++y) {
    for (let x = 0; x < m[y].length; ++x) {
      if (m[y][x] !== 0) {
        const ny = y + piece.y;
        const nx = x + piece.x;
        if (nx < 0 || nx >= COLS || ny >= ROWS || (ny >= 0 && b[ny][nx] !== 0)) {
          return true;
        }
      }
    }
  }
  return false;
}

function merge(b, piece) {
  piece.shape.forEach((row, y) => {
    row.forEach((value, x) => {
      if (value !== 0) {
        b[y + piece.y][x + piece.x] = value;
      }
    });
  });
}

function rotate(matrix) {
  return matrix[0].map((_, i) => matrix.map(row => row[i]).reverse());
}

function playerRotate() {
  if (isPaused || isGameOver || !currentPiece) return;
  const prevShape = currentPiece.shape;
  currentPiece.shape = rotate(currentPiece.shape);
  if (collide(board, currentPiece)) {
    // Wall kick attempt
    currentPiece.x += 1;
    if (collide(board, currentPiece)) {
      currentPiece.x -= 2;
      if (collide(board, currentPiece)) {
        currentPiece.x += 1;
        currentPiece.shape = prevShape;
        return;
      }
    }
  }
  playSound(420, 0.05, 'triangle');
}

function playerMove(dir) {
  if (isPaused || isGameOver || !currentPiece) return;
  currentPiece.x += dir;
  if (collide(board, currentPiece)) {
    currentPiece.x -= dir;
  } else {
    playSound(260, 0.04);
  }
}

function playerDrop() {
  if (isPaused || isGameOver || !currentPiece) return;
  currentPiece.y++;
  if (collide(board, currentPiece)) {
    currentPiece.y--;
    merge(board, currentPiece);
    playSound(180, 0.06, 'square');
    clearLines();
    resetPiece();
  }
  dropCounter = 0;
}

function playerHardDrop() {
  if (isPaused || isGameOver || !currentPiece) return;
  while (!collide(board, currentPiece)) {
    currentPiece.y++;
  }
  currentPiece.y--;
  merge(board, currentPiece);
  playSound(240, 0.08, 'sawtooth');
  clearLines();
  resetPiece();
  dropCounter = 0;
}

function playerHold() {
  if (isPaused || isGameOver || !canHold || !currentPiece) return;
  if (!holdPiece) {
    holdPiece = { typeId: currentPiece.typeId, shape: SHAPES[currentPiece.typeId] };
    resetPiece();
  } else {
    const temp = holdPiece;
    holdPiece = { typeId: currentPiece.typeId, shape: SHAPES[currentPiece.typeId] };
    currentPiece = {
      shape: temp.shape,
      typeId: temp.typeId,
      x: Math.floor(COLS / 2) - Math.ceil(temp.shape[0].length / 2),
      y: 0
    };
  }
  canHold = false;
  drawMini(holdCtx, holdPiece?.shape, holdPiece?.typeId);
  playSound(350, 0.06);
}

function clearLines() {
  let cleared = 0;
  outer: for (let y = ROWS - 1; y >= 0; --y) {
    for (let x = 0; x < COLS; ++x) {
      if (board[y][x] === 0) continue outer;
    }
    const row = board.splice(y, 1)[0].fill(0);
    board.unshift(row);
    ++cleared;
    ++y;
  }
  if (cleared > 0) {
    lines += cleared;
    const pts = [0, 100, 300, 500, 800][cleared] * level;
    score += pts;
    level = Math.floor(lines / 10) + 1;
    dropInterval = Math.max(120, 800 - (level - 1) * 70);
    document.getElementById('scoreVal').innerText = score;
    document.getElementById('linesVal').innerText = lines;
    document.getElementById('levelVal').innerText = level;
    playSound(520 + cleared * 100, 0.15, 'triangle');
    if (score > parseInt(localStorage.getItem('ar_port_tetris_best') || '0')) {
      localStorage.setItem('ar_port_tetris_best', score);
      document.getElementById('bestVal').innerText = score;
    }
  }
}

function resetPiece() {
  currentPiece = nextPiece || randomPiece();
  nextPiece = randomPiece();
  canHold = true;
  drawMini(nextCtx, nextPiece.shape, nextPiece.typeId);
  if (collide(board, currentPiece)) {
    isGameOver = true;
    playSound(140, 0.4, 'sawtooth');
    document.getElementById('modalTitle').innerText = "O'YIN TUGADI";
    document.getElementById('modalScore').innerText = "Jami Ball: " + score;
    document.getElementById('overlay').classList.add('active');
  }
}

function drawBlock(c, x, y, colorId) {
  const color = COLORS[colorId];
  c.fillStyle = color;
  c.fillRect(x * BLOCK + 1, y * BLOCK + 1, BLOCK - 2, BLOCK - 2);
  c.fillStyle = 'rgba(255,255,255,0.3)';
  c.fillRect(x * BLOCK + 1, y * BLOCK + 1, BLOCK - 2, 3);
  c.fillRect(x * BLOCK + 1, y * BLOCK + 1, 3, BLOCK - 2);
  c.fillStyle = 'rgba(0,0,0,0.3)';
  c.fillRect(x * BLOCK + 1, (y + 1) * BLOCK - 3, BLOCK - 2, 2);
  c.fillRect((x + 1) * BLOCK - 3, y * BLOCK + 1, 2, BLOCK - 2);
}

function drawMini(c, shape, typeId) {
  c.clearRect(0, 0, 60, 60);
  if (!shape) return;
  const size = 12;
  const offX = Math.floor((60 - shape[0].length * size) / 2);
  const offY = Math.floor((60 - shape.length * size) / 2);
  shape.forEach((row, y) => {
    row.forEach((val, x) => {
      if (val !== 0) {
        c.fillStyle = COLORS[typeId];
        c.fillRect(offX + x * size, offY + y * size, size - 1, size - 1);
      }
    });
  });
}

function draw() {
  ctx.clearRect(0, 0, boardCanvas.width, boardCanvas.height);

  // Draw grid
  ctx.strokeStyle = 'rgba(255,255,255,0.04)';
  ctx.lineWidth = 1;
  for (let x = 0; x <= COLS; x++) {
    ctx.beginPath(); ctx.moveTo(x * BLOCK, 0); ctx.lineTo(x * BLOCK, ROWS * BLOCK); ctx.stroke();
  }
  for (let y = 0; y <= ROWS; y++) {
    ctx.beginPath(); ctx.moveTo(0, y * BLOCK); ctx.lineTo(COLS * BLOCK, y * BLOCK); ctx.stroke();
  }

  // Draw placed blocks
  board.forEach((row, y) => {
    row.forEach((val, x) => {
      if (val !== 0) drawBlock(ctx, x, y, val);
    });
  });

  // Draw active piece
  if (currentPiece) {
    currentPiece.shape.forEach((row, y) => {
      row.forEach((val, x) => {
        if (val !== 0) drawBlock(ctx, x + currentPiece.x, y + currentPiece.y, currentPiece.typeId);
      });
    });
  }
}

function update(time = 0) {
  const delta = time - lastTime;
  lastTime = time;
  if (!isPaused && !isGameOver) {
    dropCounter += delta;
    if (dropCounter > dropInterval) {
      playerDrop();
    }
  }
  draw();
  requestAnimationFrame(update);
}

function restartGame() {
  board = Array.from({length: ROWS}, () => Array(COLS).fill(0));
  score = 0; lines = 0; level = 1;
  document.getElementById('scoreVal').innerText = '0';
  document.getElementById('linesVal').innerText = '0';
  document.getElementById('levelVal').innerText = '1';
  holdPiece = null;
  drawMini(holdCtx, null, 0);
  isGameOver = false;
  isPaused = false;
  document.getElementById('overlay').classList.remove('active');
  nextPiece = randomPiece();
  resetPiece();
}

// Button controls
document.getElementById('btnLeft').addEventListener('click', () => playerMove(-1));
document.getElementById('btnRight').addEventListener('click', () => playerMove(1));
document.getElementById('btnRotate').addEventListener('click', () => playerRotate());
document.getElementById('btnDrop').addEventListener('click', () => playerHardDrop());
document.getElementById('btnHold').addEventListener('click', () => playerHold());
document.getElementById('modalBtn').addEventListener('click', restartGame);
document.getElementById('btnPause').addEventListener('click', () => {
  isPaused = !isPaused;
  document.getElementById('pauseIcon').innerText = isPaused ? '▶' : '⏸';
  if (isPaused) {
    document.getElementById('modalTitle').innerText = "PAUZA";
    document.getElementById('modalScore').innerText = "Davom ettirish uchun bosing";
    document.getElementById('overlay').classList.add('active');
  } else {
    document.getElementById('overlay').classList.remove('active');
  }
});

// Spatial Gesture API
window.onArGesture = function(gesture) {
  if (isGameOver) {
    if (gesture === 'TAP' || gesture === 'PINCH') restartGame();
    return;
  }
  switch(gesture) {
    case 'SWIPE_LEFT': playerMove(-1); break;
    case 'SWIPE_RIGHT': playerMove(1); break;
    case 'SWIPE_DOWN': playerHardDrop(); break;
    case 'TAP':
    case 'PINCH':
    case 'ROTATE':
      playerRotate(); break;
  }
};

// Touch gestures
let startX = 0, startY = 0;
boardCanvas.addEventListener('touchstart', (e) => {
  const t = e.touches[0];
  startX = t.clientX; startY = t.clientY;
}, { passive: true });

boardCanvas.addEventListener('touchend', (e) => {
  const t = e.changedTouches[0];
  const dx = t.clientX - startX;
  const dy = t.clientY - startY;
  if (Math.abs(dx) > 30 && Math.abs(dx) > Math.abs(dy)) {
    playerMove(dx > 0 ? 1 : -1);
  } else if (dy > 40 && Math.abs(dy) > Math.abs(dx)) {
    playerHardDrop();
  } else if (Math.abs(dx) < 15 && Math.abs(dy) < 15) {
    playerRotate();
  }
}, { passive: true });

// Keyboard backup
window.addEventListener('keydown', (e) => {
  if (e.key === 'ArrowLeft') playerMove(-1);
  if (e.key === 'ArrowRight') playerMove(1);
  if (e.key === 'ArrowUp') playerRotate();
  if (e.key === 'ArrowDown') playerDrop();
  if (e.key === ' ') playerHardDrop();
  if (e.key === 'c' || e.key === 'C') playerHold();
});

// Start
nextPiece = randomPiece();
resetPiece();
update();
</script>
</body>
</html>
